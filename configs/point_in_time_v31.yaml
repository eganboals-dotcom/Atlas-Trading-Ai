# v31: earnings quality and the rotation on a list with no survivor bias, tested by scripts/v31_point_in_time.py.
#
# Why: nearly every result so far rests on 300 companies picked around today's market, and v25's list holds only companies alive today.
# Companies that failed or were bought are missing, so a rule can look better than it was. This list holds who was really there.
#
# PRE-REGISTERED 2026-10-31, written before any bar of this list was downloaded. It's a new check of two rules already run, so it isn't a fresh
# rule, and those rules' years are used years. A failed test stays failed. Nothing is tuned, and the frozen trackers don't change.
#
# Who existed: SEC Forms 3, 4 and 5 (the stored quarterly insider zips) name each filing's company number and ticker. Every listed company's
# insiders file these, so each company's ticker in each quarter comes from what was filed at the time. Each quarter takes the ticker most
# used that quarter, so a typo can't count. A company's last ticker's bars run from its first quarter seen until they break for more than
# max_gap_days, or until another company that files past this one's last filing takes the ticker, which keeps out a reused ticker. If an earlier
# ticker has no bars, the later ticker's history stands in, since Alpaca carries renames. Where two tickers of one company join, the earlier
# prices are scaled so the join makes no return.
#
# Changed 2026-10-31, before the run and before any rule's return was seen. The draft ended bars 130 days after the last filing (tail_days). The
# check showed that stopped healthy companies whose insiders went quiet (XRX, NCNO, NFE, BNGO), and marked some failed, a false total loss. It's
# replaced by the two conditions above, and failed companies are reviewed by hand before the run. cut_at was added for the same reason: excluding
# a bankrupt company would drop the very failure this list exists to catch, so it ends on its last day before the exit instead. That also drops
# the new shares after the exit, which understates both the rule and the yardstick a little. not_failed holds companies whose bars end at a
# rename or a new legal entity. A renamed company's next ticker now starts the day after its last bar, which closes holes of up to months.
#
# The pool, at each rebalance: the pool_size companies with a bar on the last close and the highest median daily dollar volume over 63
# sessions, sessions with no bar counting as zero. It's a list made the way the 300 might have been made at the time. Foreign companies that
# don't file these forms are missing, and so are banks that report only to their regulator, such as Signature Bank.
#
# Companies that stop: bars with no volume don't count. A company whose last real bar is more than 5 sessions before last_scored has
# stopped. If its last close is at or below half its close 126 sessions earlier, it counts as failed and is a total loss the next session.
# Otherwise it counts as bought, and it stays at its last close. A beaten-down company that was bought counts as failed, which is
# harsh, and any company that fell slowly counts as bought, which is kind. The side result "all at the last close" shows the same with no losses.
#
# Rule K of v23 exactly, every 63 sessions from first_scored, 2 bps each way, cash earning BIL: the top fifth of the pool by earnings quality,
# from filings filed before the rebalance, equal weights. Banks and insurers aren't eligible. Fewer than min_eligible: refused.
# Yardstick: Hold on this pool, equal weights in all pool_size companies, banks included, reset at each rebalance.
#
# It must pass all of these to be called confirmed:
# TEST 1 (the money): the top fifth beats the yardstick on Sharpe and annual return.
# TEST 2 (control): the top fifth makes more than the bottom fifth.
# TEST 3 (not luck): a higher Sharpe than the yardstick without its two best years against the yardstick.
# TEST 4 (both halves): a higher Sharpe than the yardstick in each half.
# TEST 5 (not just loss-makers): the rule among companies with positive net income also beats the yardstick on Sharpe and annual return.
# TEST 6 (the market): the top fifth beats SPY, dividends included, on Sharpe and annual return.
#
# The rotation, v29's monthly rule at 10 bps with every setting unchanged, tested separately. Its list comes the same way as v27's, each January
# from data through the prior year's last session, but from the top pool_size companies by dollar volume over 252 sessions on that
# day, with 253 sessions of bars, instead of from the survivors. A company with no bar on a book's last close can't be picked.
# TEST 7: it beats SPY on Sharpe and annual return.
# TEST 8: it beats holding its list equally, reset each January, on Sharpe and annual return.
#
# Measured, which passes or fails nothing, and the plainest answer to why this exists: Hold on this pool against Hold on the 300, each year, over
# the same days. The gap is the survivor bias in the yardstick. Also the same at "all at the last close", failed companies held and how
# many stopped, and the rule and Hold at the first_scored window for pool_size_side, which is closer to a broad market.
#
# Before the run, a check prints the pool's size, how many stopped and failed, and the largest daily moves, and no rule's return. A company
# whose bars are plainly wrong, for example a bankruptcy exit joined to its cancelled shares or a missed split, can go under exclude then,
# with the reason, and never after. A bankruptcy exit goes under cut_at, with its last day before the exit, so the company still stops. Moves
# before first_scored touch no scored return, so they're left alone. Bars after last_fetch aren't downloaded and filings after it aren't
# read, so v20's promise holds.
