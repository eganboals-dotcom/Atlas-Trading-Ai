# Swing v4 on the stocks30b universe: roughly the 31st-60th largest US companies at the end of 2015 (from memory, approximate; Celgene, since acquired, left out), a second stock list to replicate stocks30 results on.
# Same folds, costs, activity gate and untouched holdout as configs/swing.yaml (v3). Changes in v4:
# only the families that held up or are new, and idle cash earns T-bill interest (BIL), as a real account would.
# Data: python -m atlas.cli fetch-daily --out data/processed/alpaca_daily_v3 --symbols <symbols below> BIL
experiment_name: swing_v4_stocks30b
dataset_dir: data/processed/alpaca_daily_v3
symbols: [MO, AMGN, MA, C, BA, MMM, UNH, MCD, QCOM, SLB, ABBV, CVS, UPS, BMY, MDT, NKE, SBUX, UNP, HON, USB, LLY, TXN, BIIB, WBA, MDLZ, COST, LOW, ACN, ABT, GS]
cash_symbol: BIL
holdout_start: 2026-04-28

warmup_days: 260
train_days: 504
embargo_days: 5
validation_days: 126
step_days: 126

families: [rotation, risk_rotation, vol_target, session, bracket, event_drift]
population: 30
generations: 12
seed: 7

costs_bps: {zero: 0.0, low: 0.5, optimistic: 1.0, base: 2.0, pessimistic: 5.0}
min_exposure: 0.25
min_trades_per_year: 4
