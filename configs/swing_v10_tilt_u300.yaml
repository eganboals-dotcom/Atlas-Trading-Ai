# Swing v10 on u300: always-invested tilt bots on a wide list. The 300 most-traded US companies in January
# 2016 (average daily dollar volume; scratch screen of EDGAR's current tickers), one share class each, with a US
# annual report (10-K) filed by 2016. Left out before any returns were looked at: funds and trusts, tickers
# whose 2016 prices belong to another company (reused tickers, spin-offs: APC BMR FIT SE B LB TW AMTD GEN MBLY
# DOC CB DOW DD UA FOXA JCI AA WTW BFH VMRK MRSH), and companies whose current SEC filer only starts after 2016
# (new holding companies such as Broadcom, BlackRock, Cigna). Survivorship remains: today's tickers only.
#
# Written down before these prices were downloaded. The test: the fixed rule "tilt: quality + momentum + low
# volatility, tilt 0.5, quarterly" (always fully invested; weights from 0.5x to 1.5x of equal weight by the
# average rank of the three) passes Hold's rule on the unseen validation days at base costs (Sharpe above Hold's
# and annual return at least Hold's). Single-factor tilts and everything else are side results.
# Data: python -m atlas.cli fetch-daily --out data/processed/alpaca_daily_u300 --symbols <symbols below> BIL
#       python -m atlas.cli fetch-daily --adjustment raw --out data/processed/alpaca_daily_raw --symbols <symbols>
#       python -m atlas.cli fetch-sec --symbols <symbols below>
