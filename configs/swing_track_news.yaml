# Forward tracker for the news desk (python -m atlas.cli swing-track --config configs/swing_track_news.yaml).
# Frozen on 2026-10-28, before any scored day (re-frozen that evening when the AI reader moved from Claude to
# a free model on this PC; no day had been scored). Each news bot trades one reader's briefing (see
# configs/news_desk.yaml): local (free AI model on this PC, names hidden) and keyword (fixed rules), so the two
# readers are compared on the same days, next to Hold. Run `news-desk` before this so the notes are up to date.
# Uses the bars downloaded by configs/swing_track.yaml (same dataset_dir); --no-fetch is enough after that run.
start_date: 2026-10-29
history_start: 2016-01-04
out_dir: artifacts/reports/swing_track_news
dataset_dir: data/processed/swing_track
notes_dir: data/processed/news_notes
cash_symbol: BIL
cost_bps: 2.0

universes:
  stocks30: [AAPL, GOOGL, MSFT, BRK.B, XOM, AMZN, META, GE, JNJ, WFC, JPM, WMT, PG, VZ, T, PFE, KO, CVX, ORCL, DIS, MRK, PEP, HD, V, INTC, CSCO, BAC, IBM, GILD, CMCSA]
  stocks30b: [MO, AMGN, MA, C, BA, MMM, UNH, MCD, QCOM, SLB, ABBV, CVS, UPS, BMY, MDT, NKE, SBUX, UNP, HON, USB, LLY, TXN, BIIB, MDLZ, COST, LOW, ACN, ABT, GS]

rules:
  - name: "local AI: tilt toward good news, away from bad"
    universe: stocks30
    family: brief_tilt
    reader: local
    genome: {window: 5, thr: 1.0, tilt: 0.5, rebalance: 1}
  - name: "local AI: buy good news, hold 5 days"
    universe: stocks30
    family: brief_drift
    reader: local
    genome: {trend_filter: 0.0, trend_n: 200, side: 1.0, thr: 0.8, hold_days: 5}
  - name: "local AI: tilt toward good news, away from bad"
    universe: stocks30b
    family: brief_tilt
    reader: local
    genome: {window: 5, thr: 1.0, tilt: 0.5, rebalance: 1}
  - name: "local AI: buy good news, hold 5 days"
    universe: stocks30b
    family: brief_drift
    reader: local
    genome: {trend_filter: 0.0, trend_n: 200, side: 1.0, thr: 0.8, hold_days: 5}
  - name: "keyword: tilt toward good news, away from bad"
    universe: stocks30
    family: brief_tilt
    reader: keyword
    genome: {window: 5, thr: 1.0, tilt: 0.5, rebalance: 1}
  - name: "keyword: buy good news, hold 5 days"
    universe: stocks30
    family: brief_drift
    reader: keyword
    genome: {trend_filter: 0.0, trend_n: 200, side: 1.0, thr: 0.8, hold_days: 5}
  - name: "keyword: tilt toward good news, away from bad"
    universe: stocks30b
    family: brief_tilt
    reader: keyword
    genome: {window: 5, thr: 1.0, tilt: 0.5, rebalance: 1}
  - name: "keyword: buy good news, hold 5 days"
    universe: stocks30b
    family: brief_drift
    reader: keyword
    genome: {trend_filter: 0.0, trend_n: 200, side: 1.0, thr: 0.8, hold_days: 5}
