# Swing v11 on u300 (the list of configs/swing_v10_tilt_u300.yaml): three information sources besides prices.
#  * earnings surprises: diluted EPS vs the same quarter a year earlier, scaled by its usual spread, from the
#    quarterly filings (fetch-sec), counted from the day after filing, for 92 days
#  * insider buying: open-market purchases by directors and officers (fetch-insider + build-insider), counted
#    from the day after the Form 4 filing; a cluster is 2+ different insiders in 90 days
#  * short interest: FINRA days-to-cover (fetch-short), counted 14 days after settlement; June 2021 on only
#
# Written down before any of these signals was tested. Each test is a fixed rule on the unseen validation days
# at base costs; it passes only if (a) it passes Hold's rule (Sharpe above Hold's, annual return at least
# Hold's) and (b) its control shows the expected order: for earnings, the top fifth by surprise beats the bottom
# fifth; for insiders, companies with clusters beat those without; for short interest (measured from July 2021,
# when the data starts), the least-shorted fifth beats the most-shorted fifth. Three tests at once: one passing
# alone is weak evidence.
#   1. "earnings surprise (SUE): top 10, monthly"
#   2. "tilt: insider buying clusters, tilt 0.5, monthly"
#   3. "tilt: low short interest, tilt 0.5, monthly"
