# Forward tracker for the two signals that passed their tests (python -m atlas.cli swing-track --config
# configs/swing_track_signals.yaml). Frozen on 2026-10-28, before any scored day; fixed rules from
# configs/swing_v11_signals_u300.yaml, whose pass tests were written before they were run:
#  * earnings surprise top 10: +17.3% a year vs Hold +16.1% (Sharpe 0.75 vs 0.70), 2019-2026; the biggest
#    surprises beat the smallest (+17.2% vs +14.2%)
#  * low-short-interest tilt: +11.7% vs +10.9% from July 2021 (FINRA's data starts then); the least-shorted
#    fifth +15.2% vs the most-shorted +6.7%
# Uses the 300-company bars downloaded by configs/swing_track_u300.yaml just before (fetch_bars: false); its own
# run only refreshes FINRA's short-interest files (SEC filings are refreshed by the u300 tracker).
start_date: 2026-10-29
history_start: 2016-01-04
out_dir: artifacts/reports/swing_track_signals
dataset_dir: data/processed/swing_track_u300
raw_dataset_dir: data/processed/swing_track_u300_raw
fundamentals_dir: data/processed/sec_fundamentals
short_interest_path: data/processed/short_interest.parquet
fetch_bars: false
cash_symbol: BIL
cost_bps: 2.0

universes:
  u300: [AAPL, META, AMZN, MSFT, NFLX, GOOGL, BAC, GE, XOM, JPM, C, GILD, CVX, WFC, T, PFE, JNJ, DIS, VZ, MCD,
