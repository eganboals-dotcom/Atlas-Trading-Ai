# Paper trading on LIVE market prices from Alpaca (free plan: real-time IEX quotes and trades).
# Market data only: Atlas reads prices from data.alpaca.markets and never sends an order anywhere.
# Every order and fill is simulated by Atlas's internal paper broker.
#
# Setup (once): create an Alpaca *paper* account, generate its API keys, and put them in .env:
#     APCA_API_KEY_ID=...
#     APCA_API_SECRET_KEY=...
# Run (any time before or during market hours; it waits for 09:30 ET and stops at 16:00 ET):
#     python -m atlas.cli paper --config configs/paper_live.yaml   (opens the leaderboard window)
mode: paper
live_orders_enabled: false
session_name: live_{date}
simulator_config: configs/simulator.yaml
risk_config: configs/risk_live.yaml

feed:
  kind: alpaca
  first_quote_timeout_ms: 60000
  alpaca:
    feed: iex
    poll_interval_ms: 1000        # latest quotes every second
    trade_poll_every: 2           # latest trades every 2 s  (90 requests/min; free limit is 200)
    start_time: "09:30:00"
    end_time: "16:00:00"
    wait_for_open: true
    env_file: .env

# Nine bots listed here + the permanent coin-flip bot = 10 bots, plus the permanent buy-and-hold benchmark.
# All are frozen: nothing trains during the session.
# NOTE: the first three were evolved on synthetic data; TrendFollow, Pullback and SmartHold were evolved on
# 1-minute SIP bars but showed no out-of-sample edge over buy-and-hold. Live results are not evidence of an edge.
# Each bot's `name` is what you see on the leaderboard, in reports, and in the fund ledger.
candidate: {name: Liquidity, source: checkpoint, path: bots/live_lineup_v2.json, rank: 0}
shadows:
  - {name: Regime, source: checkpoint, path: bots/live_lineup_v2.json, rank: 1}
  - {name: MomentumEvo, source: checkpoint, path: bots/live_lineup_v2.json, rank: 2}
  - {name: Momentum, source: baseline, baseline: baseline_momentum}
  - {name: MeanRevert, source: baseline, baseline: baseline_mean_reversion}
  - {name: Random, source: baseline, baseline: baseline_random}
  - {name: TrendFollow, source: checkpoint, path: bots/live_lineup_v2.json, rank: 3}
  - {name: Pullback, source: checkpoint, path: bots/live_lineup_v2.json, rank: 4}
  - {name: SmartHold, source: checkpoint, path: bots/live_lineup_v2.json, rank: 5}
# Always added automatically and can't be removed: "Flip" (every 5 min, per symbol: coin flip, hold 1 share
# or none) and "Hold" (the buy-and-hold benchmark). These two names are reserved.

# Fund: $100,000 split equally across the 10 bots on day 1 ($10,000 each). Each bot trades only its share;
# at the close its positions are sold at the bid, and it starts the next day with whatever it ended with.
# The ledger is artifacts/paper/fund_ledger.json. `--reset-fund` archives it and splits afresh.
fund: {total_capital: 100000, flatten_at_close: true}

# Save every quote and trade received (data/raw/alpaca_iex_live/<date>.csv, plus a daily Parquet session in
# data/processed/alpaca_iex_live/ for training and testing). Local only: data/ is never committed.
record: {enabled: true, dataset: alpaca_iex_live}

agent_limits: {max_position_shares: 1000, max_order_shares: 500, max_position_frac: 0.5}
decision_interval_ms: 2000        # polled data: decide at most every 2 s
# No bot (Flip and Hold too) trades before 09:35 ET: in the first 5 minutes spreads were ~8 bps vs ~1.4 later
# (live sessions of Oct 27-28, 2026), and the bots' losses were their spread costs. They still watch the data.
trade_start: "09:35:00"
alerts: {console: true, file: true}
output_dir: artifacts/paper
state_flush_events: 200
dashboard: {window: app, open_on_start: false, port: 8501, live_snapshot_ms: 1000}  # native leaderboard window; browser page off
