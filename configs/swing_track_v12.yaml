rules:
  - name: "tilt: quality + earnings surprise + low short interest, tilt 0.5, monthly"
    universe: u300
    family: tilt
    genome: {factor: 8.0, tilt: 0.5, rebalance: 21}
  - name: "earnings surprise (news, vs estimate): top 10, weekly"
    universe: u300
    family: fund_rank
    genome: {factor: 6.0, top_k: 10, rebalance: 5}
  - name: "tilt: earnings surprise (news, vs estimate), tilt 0.5, weekly"
    universe: u300
    family: tilt
