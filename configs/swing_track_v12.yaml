# Forward tracker for v12 (configs/swing_v12_news_eps_u300.yaml): the combined tilt and the two headline
# earnings-surprise rules. Frozen on 2026-10-28, before any scored day AND before v12's backtest results were
# seen, so all three are tracked whatever the backtest said. The combined tilt's three parts were picked for
# passing on the backtest's unseen days, so these real future days are its only clean test.
# Uses the 300-company bars downloaded by configs/swing_track_u300.yaml just before (fetch_bars: false); its own
# run refreshes FINRA short interest and the headlines for these symbols (news_dir).
start_date: 2026-10-29
history_start: 2016-01-04
out_dir: artifacts/reports/swing_track_v12
dataset_dir: data/processed/swing_track_u300
raw_dataset_dir: data/processed/swing_track_u300_raw
fundamentals_dir: data/processed/sec_fundamentals
short_interest_path: data/processed/short_interest.parquet
news_dir: data/raw/alpaca_news/u300
fetch_bars: false
cash_symbol: BIL
cost_bps: 2.0

universes:
  u300: [AAPL, META, AMZN, MSFT, NFLX, GOOGL, BAC, GE, XOM, JPM, C, GILD, CVX, WFC, T, PFE, JNJ, DIS, VZ, MCD,
