# Evolution configuration. Validated on load; unknown keys are rejected.
experiment_name: synthetic_baseline_v1
seed: 2026
population_size: 50          # fixed by the spec
parent_count: 5
offspring_per_parent: 10     # 5 x 10 = 50
generations: 5
families: [momentum, mean_reversion, order_flow, liquidity, regime_adaptive]

simulator_config: configs/simulator.yaml
data_config: configs/data.yaml

evaluation:
  # Every agent is evaluated on the same fixed windows with the same costs.
  # Phase 3 replaces these with chronological walk-forward folds and an untouched holdout.
  windows:
    - {session_date: 2026-10-05, seed: 101}
    - {session_date: 2026-10-06, seed: 102}
    - {session_date: 2026-10-07, seed: 103}
  duration_s: 600
  symbols: [SPY, QQQ]
  decision_interval_ms: 500
  workers: 0                 # 0 = one process per CPU core minus one

limits:
  max_position_shares: 2000
  max_order_shares: 500
  max_position_frac: 0.5

fitness:                     # frozen before any comparison; fingerprint is logged each generation
  weights:  {net_return: 1.0, max_drawdown: 0.5, downside: 0.25, turnover: 0.1, instability: 0.25}
  anchors:  {net_return: 0.001, max_drawdown: 0.005, downside: 0.001, turnover: 5.0, instability: 0.001}
  gates:
    max_drawdown: 0.03
    min_fills: 30            # below this, results are labeled insufficient evidence, not ranked
    min_windows_traded: 3    # must trade in every window
    max_turnover: 200
    max_violations: 0

offspring:                   # per parent; must sum to offspring_per_parent
  elite_copies: 1
  small_mutations: 6
  large_mutations: 2
  immigrants: 1
  small_scale: 0.05
  large_scale: 0.25
  mutation_rate: 0.3
  crossover_rate: 0.2

diversity:
  min_parent_distance: 0.15
  max_parents_per_family: 2  # stops one family taking over the population in a generation
  novelty_threshold: 0.25
  novelty_archive_size: 50
  champion_archive_size: 20

on_insufficient_parents: hold   # hold | explore
checkpoint_dir: artifacts/checkpoints
reports_dir: artifacts/reports/evolution
