# Swing v12 on u300 (the list of configs/swing_v10_tilt_u300.yaml): earnings surprises read from the headlines
# on the day they are announced, and the three signals that passed in v8-v11 combined.
#  * headline surprise: reported EPS minus the analysts' estimate, both in Benzinga headlines ("Q4 EPS $1.46
#    Beats $1.37 Estimate"), divided by the unadjusted share price the day before; known from the first open
#    after the headline (09:15 cut-off), kept 63 trading days. v11's surprise waited for the 10-Q, often weeks
#    later, and compared with the same quarter a year earlier rather than with what analysts expected. v5 tried
#    only "beat or not" on 30 companies (noise); this ranks the size of the surprise across 300.
#  * combined: the mean rank of quality, earnings surprise (10-Q) and low short interest.
#
# Written down before any of these rules was run. Each test is a fixed rule on the unseen validation days at
# base costs (2 bps); it passes only if (a) it passes Hold's rule (Sharpe above Hold's, annual return at least
# Hold's) and (b) its control shows the expected order: the top fifth by headline surprise (re-picked weekly)
# beats the bottom fifth. Headlines start in July 2018, so the first fold's six months of training have no
# surprises, which doesn't matter for fixed rules.
#   1. "earnings surprise (news, vs estimate): top 10, weekly"
#   2. "tilt: earnings surprise (news, vs estimate), tilt 0.5, weekly"
# Also reported, not tests:
#   3. "tilt: quality + earnings surprise + low short interest, tilt 0.5, monthly". Its three parts were picked
#      for passing on these same unseen days, so a pass here is expected and proves little; a fail would matter.
#      The real test of it is the forward tracker.
#   4. Speed: the filing-based surprise re-picked weekly (top 10) next to test 1, on the same days.
#   5. Costs: tests 1-2 at 0 to 5 bps (the costs_bps scenarios).
