[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-trading-ai"
version = "0.1.0"
description = "Research platform for evolving and evaluating algorithmic trading agents in a realistic, deterministic market simulator."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
# Exact pins; the full transitive lock lives in requirements-lock.txt.
dependencies = [
    "numpy==2.5.4",
    "polars==2.1.0",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "tzdata==2026.5",
]

[project.optional-dependencies]
# Phase 4 PPO policy family. CPU wheels: pip install -e .[rl] --extra-index-url https://download.pytorch.org/whl/cpu
rl = [
    "torch==2.14.1",
    "gymnasium==1.4.0",
]
# Phase 5 read-only dashboard: streamlit run src/atlas/dashboard/app.py
dashboard = [
    "streamlit==1.66.1",
    "plotly==7.1.0",
]
# Write-up charts (scripts/build_report.py): pip install -e .[report]
report = [
    "matplotlib==3.9.2",
]
# AI news reader (atlas.feeds.anthropic_api): pip install -e .[news]; key ANTHROPIC_API_KEY in .env
news = [
    "anthropic==2.3.0",
]
# Native leaderboard window (Edge WebView2 on Windows): python -m atlas.cli paper-window
window = [
    "pywebview==6.2.1",
]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.170.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
